name: "FAP: Build for multiple SDK sources"
# Builds the app for the official dev and release firmware channels, and once a
# day to catch SDK changes early. Also checks formatting with `ufbt lint`.
# See https://github.com/marketplace/actions/build-flipper-application-package-fap

on:
  push:
  pull_request:
  schedule:
    # do a build every day
    - cron: "1 1 * * *"

jobs:
  ufbt-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: dev channel
            sdk-channel: dev
          - name: release channel
            sdk-channel: release
    name: "ufbt: Build for ${{ matrix.name }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with ufbt
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        id: build-app
        with:
          sdk-channel: ${{ matrix.sdk-channel }}
      - name: Upload app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ steps.build-app.outputs.suffix }}
          path: ${{ steps.build-app.outputs.fap-artifacts }}

  ufbt-lint:
    runs-on: ubuntu-latest
    name: "ufbt: Lint"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Lint with ufbt
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        with:
          sdk-channel: release
          task: lint
